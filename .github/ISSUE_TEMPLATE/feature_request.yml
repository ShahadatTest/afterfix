name: Feature proposal
description: Describe a focused inventory-recovery improvement.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who needs this, and what task is difficult today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe a concrete before/after example with synthetic data.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and validation
      description: Which connector or workflow boundary changes? How could the result be checked?
